name: Release

# Publishes magi-research to PyPI when a v* tag is pushed.
#
# Auth is PyPI Trusted Publishing (OIDC) — no token is stored anywhere. One
# time, register a publisher at https://pypi.org/manage/account/publishing/:
#   PyPI project name : magi-research
#   Repository        : Misaka16384/magi
#   Workflow filename : release.yml      <- must match this file's name
#   Environment       : pypi
#
# workflow_dispatch is here so the very first release can be published without
# minting another tag.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # test_extension_version.py compares the extension against the last
          # release tag. A shallow clone has no tags, so the check would skip
          # in CI — silently, and CI is the only place it needs to hold.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv venv
      - run: uv pip install -e ".[test]"
      - run: uv run pytest tests -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv build
      # Catches an unrenderable README before it reaches PyPI, where a bad
      # long_description is a hard 400.
      - run: uvx twine check dist/*
      # The browser button is not in the wheel — it is not a Python package —
      # so without this it ships nowhere and the only way to get it is to
      # clone the repo. A zip of the source tree is the artifact that helps:
      # Chrome refuses a .crx that the Web Store did not sign, and on Windows
      # and macOS a self-hosted one cannot be installed at all outside
      # enterprise policy ("Linux is the only platform where Chrome users can
      # install extensions that are hosted outside of the Chrome Web Store").
      # uBlock Origin ships a zip for the same reason; Vimium and the Zotero
      # connector ship no binary at all and point at the store.
      #
      # Built into `ext/`, never `dist/`: the publish job uploads everything in
      # dist/ to PyPI, and a zip that is not a Python distribution would fail
      # that upload — or, worse, be accepted as a stray file on the project.
      - name: Package the browser extension
        run: |
          mkdir -p ext
          VER="$(python -c 'import json;print(json.load(open("browser-extension/manifest.json"))["version"])')"
          echo "extension version $VER"
          (cd browser-extension && zip -r "../ext/magi-browser-extension-v${VER}.zip" . -x '*.DS_Store')
          # A zip Chrome cannot load is worse than no zip: it fails on the
          # user's machine, at the moment they try it, with no way for them to
          # tell whether they did something wrong. Assert the files Chrome
          # requires are actually in there.
          unzip -l "ext/magi-browser-extension-v${VER}.zip" | grep -q 'manifest.json'
          unzip -l "ext/magi-browser-extension-v${VER}.zip" | grep -q '_locales/en/messages.json'
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v7
        with:
          name: extension
          path: ext/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/magi-research
    permissions:
      id-token: write      # the OIDC token trusted publishing exchanges
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # A tag with no GitHub Release is invisible to anyone who does not watch
  # PyPI: no changelog, no notification, nothing to link to. Five releases
  # went out that way before anyone noticed, so this is no longer manual.
  #
  # Notes come from the tag's own annotation when it has a body, and fall
  # back to the commit subject — write the tag message and the release
  # writes itself. Never overwrites an existing release.
  github-release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write      # creating a release is a write to the repo
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # tag annotations do not come with a shallow clone
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          name: extension
          path: ext/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it alone."
            exit 0
          fi
          # `git tag -l --format=%(contents:body)` is empty for a lightweight
          # tag and for `-m` messages that are a single line.
          BODY="$(git tag -l --format='%(contents:body)' "$TAG")"
          if [ -z "${BODY// }" ]; then
            BODY="$(git log -1 --pretty=%B "$TAG")"
          fi
          SUBJECT="$(git tag -l --format='%(contents:subject)' "$TAG")"
          [ -z "${SUBJECT// }" ] && SUBJECT="$TAG"
          # Tag messages default to --cleanup=strip, which eats every line
          # starting with '#'. Markdown headings disappear silently, so say so
          # in the log rather than shipping notes with holes in them.
          if printf '%s' "$BODY" | grep -q '^[A-Za-z].*$' && \
             ! printf '%s' "$BODY" | grep -q '^#'; then
            echo "::notice::No '#' headings in the tag body. If you wrote any," \
                 "re-tag with --cleanup=verbatim; git strips them otherwise."
          fi
          # The extension zip needs its own sentence. Chrome will not install a
          # self-hosted .crx on Windows or macOS at all, so "Load unpacked" is
          # not us being lazy — it is the only path that works without going
          # through the Web Store, and saying so stops the download looking
          # broken.
          printf '%s\n\n```bash\npipx upgrade --install magi-research\n```\n' \
            "$BODY" > notes.md
          if ls ext/*.zip >/dev/null 2>&1; then
            printf '\n---\n\n**Browser button** — `%s` below.\nUnzip it, open `chrome://extensions`, turn on Developer Mode, and use **Load unpacked** on the unzipped folder. It sends the page you are reading to a local MAGI queue and nothing else; nothing enters a library until you approve the batch.\n' \
              "$(basename ext/*.zip)" >> notes.md
          fi
          gh release create "$TAG" \
            --title "$SUBJECT" \
            --notes-file notes.md \
            --verify-tag \
            dist/* ext/*
