[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "magi-research"
version = "1.10.2"
description = "MAGI: agent-native research workspace — knowledge base, retrieval, and literature radar for CLI agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Misaka16384" }]
keywords = ["research", "knowledge-base", "agent", "cli", "retrieval", "rag",
            "literature", "obsidian", "academic", "wiki"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "pyyaml>=6.0",
    "filelock>=3.12.0",
    "requests>=2.28.0",
    "pillow>=9.0.0",
    "pymupdf>=1.22.0",
    "rich>=13.0.0",
    "scikit-learn>=1.0.0",
    "numpy>=1.20.0",
    "pylatexenc>=2.10",
    "sqlite-vec>=0.1.6",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
]

[project.optional-dependencies]
# `starlette.testclient` now requires httpx2; a fresh environment has neither
# it nor pytest, so the test job installs this extra rather than a hand-kept
# list in the workflow.
test = ["pytest>=8.0", "httpx2>=2.0"]

[project.urls]
Homepage = "https://github.com/Misaka16384/magi"
Repository = "https://github.com/Misaka16384/magi"
Issues = "https://github.com/Misaka16384/magi/issues"
Changelog = "https://github.com/Misaka16384/magi/blob/main/ROADMAP.md"

[project.scripts]
magi = "magi.cli:main"

# Dry-run target: uv publish --index testpypi
[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"magi" = ["docs/*.md", "skills/*/SKILL.md", "skills/*/templates/*.md"]
"magi.ingest.ocr" = ["Modelfile*", "*.md"]
"magi.ui" = ["static/*", "static/**/*"]

