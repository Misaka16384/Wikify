<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MAGI</title>
<style>
  /* The Institute palette from the WebUI, so the two do not look like
     different products. Chamfered corners, no border-radius, per the same
     design lock the app enforces. */
  :root {
    --bg: #F5F4EF;
    --surface: #FDFDFB;
    --subtle: #EDEBE2;
    --ink: #1D2126;
    --ink-2: #5B616B;
    --muted: #8B9098;
    --accent: #34597E;
    --sage: #67824E;
    --danger: #AE4339;
    --border: #DDDACE;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15181C; --surface: #1D2126; --subtle: #252A31;
      --ink: #ECEDEA; --ink-2: #A6ACB4; --muted: #737A84;
      --accent: #7FA8CE; --sage: #93AC74; --danger: #CF6259; --border: #30353D;
    }
  }
  * { box-sizing: border-box; }
  body {
    width: 340px;
    margin: 0;
    padding: 14px;
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.5 "Segoe UI", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  }
  .head { display: flex; align-items: baseline; justify-content: space-between; }
  h1 {
    margin: 0 0 2px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }
  #lang {
    width: auto;
    padding: 0;
    border: 0;
    background: none;
    color: var(--muted);
    font-size: 11px;
    cursor: pointer;
    clip-path: none;
  }
  #lang:hover { color: var(--accent); }
  .target {
    font-size: 12px;
    color: var(--ink-2);
    word-break: break-all;
    background: var(--subtle);
    border: 1px solid var(--border);
    padding: 6px 8px;
    margin-bottom: 12px;
    max-height: 54px;
    overflow: hidden;
    clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
  }
  label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  select, button {
    width: 100%;
    font: inherit;
    padding: 7px 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
  }
  button {
    margin-top: 10px;
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.55; cursor: default; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* The success message is two sentences separated by a newline: what MAGI
     understood the page to be, and how many items are now waiting. Without
     this they collapse onto one line and read as one sentence — worst with an
     arXiv id, where "2410.11942 2 waiting" looks like part of the number. */
  #status { margin-top: 10px; font-size: 12px; min-height: 34px; color: var(--ink-2); white-space: pre-line; }
  #status.ok { color: var(--sage); }
  #status.err { color: var(--danger); }
  .hint { margin-top: 8px; font-size: 11px; color: var(--muted); }
  code { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 11px; }
</style>
</head>
<body>
  <div class="head">
    <h1>MAGI</h1>
    <button id="lang" type="button" title="中文 / English">中 / EN</button>
  </div>
  <div class="target" id="target">…</div>

  <label for="library" id="lbl-library">Add to</label>
  <select id="library"><option>…</option></select>

  <label for="port" id="lbl-port" style="margin-top:10px">MAGI port</label>
  <select id="port"></select>

  <button id="send" disabled>Queue it</button>
  <div id="status"></div>
  <div class="hint" id="hint"></div>

  <script src="popup.js"></script>
</body>
</html>
