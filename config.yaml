# ==========================================
#  Gemini Wiki Skills — 统一配置
#  所有脚本共享此文件，用户只需编辑此处。
#  优先级: 命令行参数 > 环境变量 > 本文件 > 代码默认值
# ==========================================

# Ollama 服务配置（所有使用 Ollama 的脚本共享）
ollama:
  base_url: "http://127.0.0.1:11434"

# 模型配置
models:
  # OCR 模型（pdf2md-agent 使用）
  # 可选: glm-ocr, glm-ocr-16k, qwen3-vl, qwen3-vl:4b, qwen3-vl-fast
  ocr: "glm-ocr:q8_0"
  # 嵌入模型（semantic_linker 使用）
  embedding: "qwen3-embedding:0.6b"

# 向量化用哪个服务(magi index / magi search / magi link 共用)
embedding:
  # ollama = 本机(默认);openai = 任何 OpenAI 兼容的云端接口
  provider: ollama
  # provider: openai 时才用得上。留空则沿用 models.embedding。
  base_url:
  model:
  # 云端接口的 key。环境变量 MAGI_EMBEDDING_API_KEY 优先于这里——
  # 写进本文件的密钥是一个躺在 git 里的密钥。
  # 刻意不写在这里,而不是留空。配置是逐键覆盖的,一个显式的 "" 也是一个值,
  # 会盖掉你在 ~/.config/magi/config.yaml 里设过一次的 key,然后每个新工作区
  # 都连不上云端接口而看不出原因。要用就写进用户级文件,或者用环境变量。
  # api_key: ""

# OCR 处理参数
ocr:
  # MinerU 云端 API 配置（可选，公式/版面质量更高）。
  # 默认关闭：需先在 mineru_api_token 填入有效 Token，再将 use_mineru 设为 true 才会启用；
  # 未配置 Token 时保持 false，wiki_ingest 会自动回退到本地/原生 OCR 路径。
  mineru_api_token: "" # 填入您的 MinerU API Token（从 https://mineru.net 获取）
  use_mineru: true     # 设为 true 并填入 Token 后启用 MinerU 云端 OCR

  # 每次 OCR 的超时时间（秒）
  timeout: 180
  # 图片 DPI 设置
  # 130 经基准测试：与 150 内容一致（仅 LaTeX 风格差异），速度更快；
  # 低于 110 会在密集公式/小下标页面出现误识别，勿降低。
  dpi: 130

# 语义链接参数
semantic_link:
  # 注入链接的相似度阈值
  threshold: 0.75
  # 合并建议的相似度阈值
  merge_threshold: 0.85
  # 自动合并的相似度阈值
  auto_merge_threshold: 0.95

# 外部工具路径（留空则自动查找 PATH 和系统常见路径）
# 也可通过同名环境变量覆盖（PDFTOPPM_PATH, PDFIMAGES_PATH 等）
tools:
  pdftoppm_path: ""
  pdfimages_path: ""
  pandoc_path: ""
  pandoc_crossref_path: ""

# PDF 处理
pdf:
  # 输出图片格式
  image_format: "png"
  # 图片质量
  quality: 100

# 输出设置
output:
  # 是否保留中间图片文件
  keep_temp_images: false
  # 图片输出子文件夹名称
  image_folder: "images"
  # Markdown 文件编码
  encoding: "utf-8"

# 文献雷达（magi radar）
radar:
  # arXiv 分类（核心 + 次级）
  arxiv_categories:
    - cond-mat.str-el
    - hep-th
    - quant-ph
    - cond-mat.mes-hall
  # 种子论文（S2 推荐的正样本；library 里的 arXiv ID 会自动并入）
  seed_arxiv_ids:
    - "2606.25340"   # Fractionalized Vortices / KT transitions (Ye group 2026)
    - "2606.03582"   # Fracton Topological Holography
    - "2605.13379"   # Non-Uniform Cellular Automata
    - "2601.01523"   # Non-invertible symmetries in twisted BF TQFTs
  # arXiv 新文回溯天数
  days: 7
  # 单次 harvest 最多产出候选数
  max_candidates: 40
  # 相关度阈值:低于此分的候选被丢弃。留空 = 不过滤(默认)。
  # 实测参考:一个 67 篇的真实文库,四十个候选全部落在 0.55-0.70;明显无关
  # 的文本要低得多(通用凝聚态 0.45、机器学习 0.37、乱码 0.31)。所以这是个
  # 排序信号而不是概率——设一个「安全」的阈值等于什么都不过滤,设一个真能
  # 过滤的阈值会切掉真命中。
  min_relevance:
  # 我方已发表论文（citation-gap 侦察的锚点；默认回退到 seed_arxiv_ids）
  own_arxiv_ids:
    - "2606.25340"
    - "2606.03582"
    - "2605.13379"
    - "2601.01523"
    - "2401.00505"   # Higher-Order Cellular Automata SPT, PRX Quantum 5 (2024)
  citation_gap:
    # 候选需与我方论文共享的最少参考文献数（共引信号）
    min_shared_refs: 2
    # 只看最近 N 年的论文
    years: 2
